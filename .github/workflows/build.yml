name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build MacMiniMixer
        run: xcodebuild -project MacMiniMixer.xcodeproj -scheme MacMiniMixer -configuration Debug -derivedDataPath ./.DerivedData CODE_SIGNING_ALLOWED=NO build

      - name: Test MacMiniMixer
        run: xcodebuild test -project MacMiniMixer.xcodeproj -scheme MacMiniMixer -destination 'platform=macOS' -derivedDataPath ./.DerivedData CODE_SIGNING_ALLOWED=NO
