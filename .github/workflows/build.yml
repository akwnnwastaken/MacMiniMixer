name: Build

on:
  # Each commit is tested once, to keep macOS runs short:
  # pushes to main, pull requests, and manual runs. Pushes to other branches and tags don't run
  # this workflow (a tag runs Release instead), and docs-only changes skip it.
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Build with the newest stable Xcode on the runner (not the image's older default), so the app
      # links the current macOS SDK and gets the same control styles as a local build.
      - name: Select newest stable Xcode
        run: |
          newest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -viE 'beta|release_candidate|_rc' | sort -V | tail -1 || true)"
          if [ -n "${newest}" ]; then
            sudo xcode-select -s "${newest}/Contents/Developer"
          else
            echo "No /Applications/Xcode_*.app found; keeping the image default."
          fi
          xcodebuild -version
          echo "::notice title=Xcode::$(xcodebuild -version | tr '\n' ' ')($(xcode-select -p))"

      - name: Build MacMiniMixer
        run: xcodebuild -project MacMiniMixer.xcodeproj -scheme MacMiniMixer -configuration Debug -derivedDataPath ./.DerivedData CODE_SIGNING_ALLOWED=NO build

      # The suite takes about a minute. A hung test is killed by XCTest after 60 s (named in the log,
      # spindump in the result bundle), and the step itself stops after 10 minutes, so a hang can't
      # burn the job's whole timeout. NSUnbufferedIO streams results live instead of in chunks.
      - name: Test MacMiniMixer
        timeout-minutes: 10
        env:
          NSUnbufferedIO: 'YES'
        run: >-
          xcodebuild test -project MacMiniMixer.xcodeproj -scheme MacMiniMixer -destination 'platform=macOS'
          -derivedDataPath ./.DerivedData -resultBundlePath ./TestResults.xcresult
          -test-timeouts-enabled YES -default-test-execution-time-allowance 60 -maximum-test-execution-time-allowance 120
          CODE_SIGNING_ALLOWED=NO

      - name: Upload test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults.xcresult
          retention-days: 7
          if-no-files-found: ignore

      # Repeat the selected Xcode at the end of the log, where it is easy to find.
      - name: Xcode used
        if: always()
        run: xcodebuild -version && xcode-select -p

  # Release build packaged as an ad-hoc signed .zip (not notarized), uploaded as
  # a workflow artifact for manual testing. Does not create any GitHub Release.
  # Runs only for main and manual runs, to save macOS runner minutes on branch pushes.
  package:
    runs-on: macos-15
    needs: build
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Build with the newest stable Xcode on the runner (not the image's older default), so the app
      # links the current macOS SDK and gets the same control styles as a local build.
      - name: Select newest stable Xcode
        run: |
          newest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -viE 'beta|release_candidate|_rc' | sort -V | tail -1 || true)"
          if [ -n "${newest}" ]; then
            sudo xcode-select -s "${newest}/Contents/Developer"
          else
            echo "No /Applications/Xcode_*.app found; keeping the image default."
          fi
          xcodebuild -version
          echo "::notice title=Xcode::$(xcodebuild -version | tr '\n' ' ')($(xcode-select -p))"

      - name: Package MacMiniMixer (Release, ad-hoc signed)
        shell: bash
        run: scripts/package-app.sh --label "${GITHUB_SHA::7}"

      - name: Upload app zip
        uses: actions/upload-artifact@v4
        with:
          name: MacMiniMixer-app
          path: dist/*
          retention-days: 14
          if-no-files-found: error
