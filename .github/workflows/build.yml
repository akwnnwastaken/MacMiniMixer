name: Build

on:
  # Docs-only changes don't need a macOS runner (macOS minutes are limited).
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build MacMiniMixer
        run: xcodebuild -project MacMiniMixer.xcodeproj -scheme MacMiniMixer -configuration Debug -derivedDataPath ./.DerivedData CODE_SIGNING_ALLOWED=NO build

      - name: Test MacMiniMixer
        run: xcodebuild test -project MacMiniMixer.xcodeproj -scheme MacMiniMixer -destination 'platform=macOS' -derivedDataPath ./.DerivedData CODE_SIGNING_ALLOWED=NO

  # Release build packaged as an ad-hoc signed .zip (not notarized), uploaded as
  # a workflow artifact for manual testing. Does not create any GitHub Release.
  # Runs only for main and manual runs, to save macOS runner minutes on branch pushes.
  package:
    runs-on: macos-15
    needs: build
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Package MacMiniMixer (Release, ad-hoc signed)
        shell: bash
        run: scripts/package-app.sh --label "${GITHUB_SHA::7}"

      - name: Upload app zip
        uses: actions/upload-artifact@v4
        with:
          name: MacMiniMixer-app
          path: dist/*
          retention-days: 14
          if-no-files-found: error
