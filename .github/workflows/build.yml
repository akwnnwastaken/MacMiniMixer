name: Build

on:
  # macOS minutes are limited (private repo: they count 10x), so each commit is tested once:
  # pushes to main, pull requests, and manual runs. Pushes to other branches and tags don't run
  # this workflow (a tag runs Release instead), and docs-only changes skip it.
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build MacMiniMixer
        run: xcodebuild -project MacMiniMixer.xcodeproj -scheme MacMiniMixer -configuration Debug -derivedDataPath ./.DerivedData CODE_SIGNING_ALLOWED=NO build

      # The suite takes about a minute. A hung test is killed by XCTest after 60 s (named in the log,
      # spindump in the result bundle), and the step itself stops after 10 minutes, so a hang can't
      # burn the job's whole timeout. NSUnbufferedIO streams results live instead of in chunks.
      - name: Test MacMiniMixer
        timeout-minutes: 10
        env:
          NSUnbufferedIO: 'YES'
        run: >-
          xcodebuild test -project MacMiniMixer.xcodeproj -scheme MacMiniMixer -destination 'platform=macOS'
          -derivedDataPath ./.DerivedData -resultBundlePath ./TestResults.xcresult
          -test-timeouts-enabled YES -default-test-execution-time-allowance 60 -maximum-test-execution-time-allowance 120
          CODE_SIGNING_ALLOWED=NO

      - name: Upload test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults.xcresult
          retention-days: 7
          if-no-files-found: ignore

  # Release build packaged as an ad-hoc signed .zip (not notarized), uploaded as
  # a workflow artifact for manual testing. Does not create any GitHub Release.
  # Runs only for main and manual runs, to save macOS runner minutes on branch pushes.
  package:
    runs-on: macos-15
    needs: build
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Package MacMiniMixer (Release, ad-hoc signed)
        shell: bash
        run: scripts/package-app.sh --label "${GITHUB_SHA::7}"

      - name: Upload app zip
        uses: actions/upload-artifact@v4
        with:
          name: MacMiniMixer-app
          path: dist/*
          retention-days: 14
          if-no-files-found: error
